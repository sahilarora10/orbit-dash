<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit Dash">
<meta name="description" content="A one-tap neon arcade game: reverse your orbit, grab stars, dodge meteors.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Orbit Dash</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070f; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  canvas { position: fixed; left: 0; top: 0; display: block; cursor: pointer; outline: none; touch-action: none; }
  /* Invisible probe so the script can read the device's safe-area insets (notch / home bar). */
  #sa { position: fixed; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="sa"></div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const saProbe = document.getElementById('sa');
  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 100, S = 1;
  const SA = { t: 0, r: 0, b: 0, l: 0 };
  const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

  // ---------- adaptive quality (phones choke on shadowBlur) ----------
  let hiFx = true, dprCap = 2, frameAvg = 16, fxCheckT = 0;
  const blur = n => (hiFx ? n : 0);
  const fxN = n => (hiFx ? n : Math.ceil(n / 2));

  function resize() {
    const vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    DPR = Math.min(window.devicePixelRatio || 1, dprCap);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const cs = getComputedStyle(saProbe);
    SA.t = parseFloat(cs.paddingTop) || 0; SA.r = parseFloat(cs.paddingRight) || 0;
    SA.b = parseFloat(cs.paddingBottom) || 0; SA.l = parseFloat(cs.paddingLeft) || 0;
    // play area excludes notch / home-indicator zones
    const pw = W - SA.l - SA.r, ph = H - SA.t - SA.b;
    CX = SA.l + pw / 2;
    CY = SA.t + ph / 2 + Math.min(pw, ph) * 0.04;
    // bigger ring in portrait, but keep a visible runway for meteors entering from the sides
    R = Math.max(60, Math.min(pw * 0.34, ph * 0.28));
    S = R / 150; // scale factor for sizes & speeds
    makeStars();
  }

  // ---------- storage (sandboxed iframes may forbid it) ----------
  let best = 0;
  try { best = +localStorage.getItem('orbitDashBest') || 0; } catch (_) {}
  function saveBest() { try { localStorage.setItem('orbitDashBest', String(best)); } catch (_) {} }

  // ---------- audio ----------
  let actx = null, muted = false;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function beep(freq, dur = 0.08, type = 'sine', vol = 0.06, slide = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  // Haptics: Android Chrome supports this; iOS Safari silently ignores it.
  function buzz(pattern) { if (muted) return; try { navigator.vibrate && navigator.vibrate(pattern); } catch (_) {} }

  // ---------- background stars ----------
  let bg = [];
  function makeStars() {
    const n = Math.round((W * H) / 3500);
    bg = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.2, tw: Math.random() * 6.28 }));
  }

  // ---------- game state ----------
  let state = 'menu'; // menu | play | over | paused
  let angle, dir, score, mult, multTimer, time, spawnT, meteors, star, parts, texts, shake, flash, deathT, newBest, trail;

  function reset() {
    angle = -Math.PI / 2; dir = 1; score = 0; mult = 1; multTimer = 0; time = 0;
    spawnT = 1.2; meteors = []; parts = []; texts = []; shake = 0; flash = 0; deathT = 0; newBest = false; trail = [];
    placeStar();
  }

  const angSpeed = () => Math.min(2.3 + score * 0.035, 4.4);
  const playerPos = () => ({ x: CX + Math.cos(angle) * R, y: CY + Math.sin(angle) * R });
  const PR = () => 9 * S;

  function placeStar() {
    const off = (Math.PI * 0.6) + Math.random() * Math.PI * 0.8;
    star = { a: angle + off * (Math.random() < 0.5 ? 1 : -1), t: 0 };
  }

  function spawnMeteor() {
    const maxD = Math.hypot(W, H) / 2 + 30;
    // avoid spawning right on top of the player's current spot for fairness
    let th, tries = 0;
    do { th = Math.random() * Math.PI * 2; tries++; } while (tries < 8 && Math.abs(angDiff(th, angle)) < 0.5);
    const lvl = Math.min(score / 40, 1);
    const big = Math.random() < 0.15 + lvl * 0.15;
    const spiral = score >= 8 && Math.random() < 0.25 + lvl * 0.3;
    meteors.push({
      th, d: maxD,
      v: (95 + Math.random() * 45 + lvl * 80) * S * (big ? 0.75 : 1),
      r: (big ? 14 : 7 + Math.random() * 3) * S,
      spin: spiral ? (Math.random() < 0.5 ? -1 : 1) * (0.35 + Math.random() * 0.35) : 0,
      rot: Math.random() * 6.28, near: false, minGap: Infinity, crossed: false,
      hue: big ? 12 : (spiral ? 290 : 350),
    });
  }

  function angDiff(a, b) { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }

  function burst(x, y, n, hue, spd = 160, life = 0.7) {
    n = fxN(n);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = (Math.random() * 0.8 + 0.2) * spd * S;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, hue, r: (Math.random() * 2 + 1) * S });
    }
  }
  function popText(x, y, str, hue) { texts.push({ x, y, str, hue, t: 0 }); }

  // ---------- input ----------
  let resumeT = 0; // short freeze after unpausing so a thumb tap doesn't throw you into a meteor

  function pause() { if (state === 'play') state = 'paused'; }
  function resume() { if (state === 'paused') { state = 'play'; resumeT = 0.8; } }
  function togglePause() { state === 'paused' ? resume() : pause(); }
  function toggleMute() { muted = !muted; if (!muted) beep(880, 0.06, 'sine', 0.04); }

  function action() {
    audio();
    if (state === 'menu') { reset(); state = 'play'; resumeT = 0; beep(520, 0.1, 'triangle', 0.05, 300); return; }
    if (state === 'over') { if (deathT > 0.6) { reset(); state = 'play'; resumeT = 0; beep(520, 0.1, 'triangle', 0.05, 300); } return; }
    if (state === 'paused') { resume(); return; }
    if (resumeT > 0) return;
    dir = -dir; beep(dir > 0 ? 660 : 495, 0.05, 'square', 0.025);
    const p = playerPos(); burst(p.x, p.y, 6, 185, 90, 0.35);
  }

  // On-screen buttons (phones have no P / M keys). Hit areas are >= 48px.
  function buttons() {
    const fs = hudFs(), pad = Math.max(10, fs * 0.6), r = Math.max(16, fs * 0.8);
    const y = SA.t + pad + r;
    return {
      sound: { x: SA.l + pad + r, y, r, hit: Math.max(24, r * 1.4) },
      pause: { x: W - SA.r - pad - r, y, r, hit: Math.max(24, r * 1.4) },
    };
  }
  const inBtn = (b, x, y) => Math.hypot(x - b.x, y - b.y) <= b.hit;

  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.focus(); audio();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, b = buttons();
    if (inBtn(b.sound, x, y)) { toggleMute(); return; }
    if ((state === 'play' || state === 'paused') && inBtn(b.pause, x, y)) { togglePause(); return; }
    action();
  }, { passive: false });
  // Block long-press menus, pinch / double-tap zoom and pull-to-refresh on mobile browsers.
  cv.addEventListener('contextmenu', e => e.preventDefault());
  ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick'].forEach(t =>
    document.addEventListener(t, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));

  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); action(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    else if (e.code === 'KeyM') toggleMute();
  });
  window.addEventListener('blur', pause);
  window.addEventListener('pagehide', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // Rotation / browser-chrome changes: re-layout and pause so the ring doesn't jump under your thumb.
  let resizeQueued = false;
  function onResize() {
    if (resizeQueued) return; resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      const pw = W, ph = H; resize();
      if (state === 'play' && (Math.abs(W - pw) > 40 || Math.abs(H - ph) > 120)) pause();
    });
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

  // ---------- update ----------
  function update(dt) {
    for (const s of bg) s.tw += dt * 2;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = texts.length - 1; i >= 0; i--) { texts[i].t += dt; if (texts[i].t > 0.9) texts.splice(i, 1); }
    shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt * 3);

    if (state === 'over') { deathT += dt; }
    if (state === 'menu') { angle += dt * 1.2; trailPush(); return; }
    if (state !== 'play') return;
    if (resumeT > 0) { resumeT -= dt; return; }

    time += dt;
    angle += dir * angSpeed() * dt;
    trailPush();
    const p = playerPos(), pr = PR();

    // combo decay
    if (mult > 1) { multTimer -= dt; if (multTimer <= 0) { mult = 1; } }

    // star
    star.t += dt;
    const sx = CX + Math.cos(star.a) * R, sy = CY + Math.sin(star.a) * R;
    if (Math.hypot(p.x - sx, p.y - sy) < pr + 11 * S) {
      score += mult;
      popText(sx, sy - 14 * S, '+' + mult, 50);
      burst(sx, sy, 16, 50, 180, 0.6);
      beep(700 + mult * 120, 0.12, 'triangle', 0.05, 400); buzz(12);
      mult = Math.min(mult + 1, 5); multTimer = 3.2;
      placeStar();
    }

    // spawn meteors
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnMeteor();
      const lvl = Math.min(score / 45, 1);
      spawnT = (1.05 - lvl * 0.62) * (0.7 + Math.random() * 0.6);
      if (score > 20 && Math.random() < 0.12) spawnMeteor();
    }

    // meteors
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.d -= m.v * dt; m.th += m.spin * dt; m.rot += dt * 2;
      const mx = CX + Math.cos(m.th) * m.d, my = CY + Math.sin(m.th) * m.d;
      const gap = Math.hypot(mx - p.x, my - p.y) - (pr + m.r);
      if (gap < 0) { die(p); return; }
      if (Math.abs(m.d - R) < m.r + pr * 2) m.minGap = Math.min(m.minGap, gap);
      if (!m.crossed && m.d < R - m.r - pr * 2) {
        m.crossed = true;
        if (m.minGap < 10 * S) { score += 1; popText(p.x, p.y - 18 * S, 'CLOSE! +1', 185); beep(980, 0.07, 'sine', 0.04, 200); buzz([6, 30, 6]); burst(p.x, p.y, 8, 185, 120, 0.4); }
      }
      if (m.d < 12 * S) { burst(CX, CY, 6, m.hue, 70, 0.4); meteors.splice(i, 1); }
    }
  }

  function trailPush() { const p = playerPos(); trail.push({ x: p.x, y: p.y }); if (trail.length > 14) trail.shift(); }

  function die(p) {
    state = 'over'; deathT = 0; shake = 14; flash = 1;
    burst(p.x, p.y, 50, 185, 260, 1.1); burst(p.x, p.y, 25, 350, 200, 0.9);
    beep(220, 0.5, 'sawtooth', 0.07, -170); buzz([40, 50, 90]);
    if (score > best) { best = score; newBest = true; saveBest(); }
  }

  // ---------- draw ----------
  function glowCircle(x, y, r, color, b) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur(b); ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // background
    for (const s of bg) { ctx.globalAlpha = 0.35 + Math.sin(s.tw) * 0.25; ctx.fillStyle = '#cfd8ff'; ctx.fillRect(s.x, s.y, s.r, s.r); }
    ctx.globalAlpha = 1;

    // core
    const pulse = 1 + Math.sin(performance.now() / 300) * 0.08;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 40 * S * pulse);
    g.addColorStop(0, 'rgba(140,90,255,0.9)'); g.addColorStop(0.4, 'rgba(90,40,200,0.35)'); g.addColorStop(1, 'rgba(60,20,160,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, 40 * S * pulse, 0, 6.283); ctx.fill();
    glowCircle(CX, CY, 6 * S, '#e6dcff', 20);

    // ring
    ctx.save(); ctx.strokeStyle = 'rgba(80,220,255,0.22)'; ctx.lineWidth = 2; ctx.setLineDash([4 * S, 8 * S]);
    ctx.lineDashOffset = -performance.now() / 40 * (dir || 1);
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.283); ctx.stroke(); ctx.restore();

    // star pickup
    if (state === 'play' || state === 'over' || state === 'paused') {
      const sx = CX + Math.cos(star.a) * R, sy = CY + Math.sin(star.a) * R;
      const sp = 1 + Math.sin(star.t * 6) * 0.15;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(star.t * 1.5); ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = blur(18); ctx.fillStyle = '#ffd84a';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const rr = (i % 2 ? 4.5 : 10) * S * sp, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // meteors
    if (meteors) for (const m of meteors) {
      const mx = CX + Math.cos(m.th) * m.d, my = CY + Math.sin(m.th) * m.d;
      // tail
      const tx = CX + Math.cos(m.th - m.spin * 0.12) * (m.d + m.r * 3.2), ty = CY + Math.sin(m.th - m.spin * 0.12) * (m.d + m.r * 3.2);
      const tg = ctx.createLinearGradient(mx, my, tx, ty);
      tg.addColorStop(0, `hsla(${m.hue},100%,60%,0.55)`); tg.addColorStop(1, `hsla(${m.hue},100%,60%,0)`);
      ctx.strokeStyle = tg; ctx.lineWidth = m.r * 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.save(); ctx.translate(mx, my); ctx.rotate(m.rot); ctx.shadowColor = `hsl(${m.hue},100%,60%)`; ctx.shadowBlur = blur(16);
      ctx.fillStyle = `hsl(${m.hue},95%,62%)`; ctx.beginPath();
      for (let i = 0; i < 7; i++) { const a = i / 7 * 6.283, rr = m.r * (i % 2 ? 0.78 : 1); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // off-screen warnings: on narrow phone screens meteors can enter from just past the edge
    if (meteors && state === 'play') for (const m of meteors) {
      const c = Math.cos(m.th), s = Math.sin(m.th);
      const tx = c > 1e-6 ? (W - CX) / c : c < -1e-6 ? CX / -c : Infinity;
      const ty = s > 1e-6 ? (H - CY) / s : s < -1e-6 ? CY / -s : Infinity;
      const e = Math.min(tx, ty);
      if (m.d - m.r <= e) continue;
      const k = Math.max(0.15, Math.min(0.9, 1 - (m.d - e) / (220 * S)));
      const ed = e - 10, ix = CX + c * ed, iy = CY + s * ed, sz = Math.max(5, 6 * S) * (m.r > 12 * S ? 1.4 : 1);
      ctx.save(); ctx.globalAlpha = k; ctx.translate(ix, iy); ctx.rotate(m.th + Math.PI);
      ctx.fillStyle = `hsl(${m.hue},100%,62%)`; ctx.beginPath();
      ctx.moveTo(sz, 0); ctx.lineTo(-sz * 0.7, sz * 0.8); ctx.lineTo(-sz * 0.7, -sz * 0.8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // player + trail
    if (state !== 'over') {
      for (let i = 0; i < trail.length; i++) {
        const t = trail[i], k = i / trail.length;
        ctx.globalAlpha = k * 0.5; ctx.fillStyle = '#4fe3ff';
        ctx.beginPath(); ctx.arc(t.x, t.y, PR() * k, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const p = playerPos();
      glowCircle(p.x, p.y, PR(), '#4fe3ff', 22);
      glowCircle(p.x, p.y, PR() * 0.45, '#ffffff', 6);
    }

    // particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = `hsl(${p.hue},100%,65%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // floating texts
    for (const t of texts) {
      ctx.globalAlpha = 1 - t.t / 0.9; ctx.fillStyle = `hsl(${t.hue},100%,70%)`;
      ctx.font = `700 ${Math.round(14 * Math.max(S, 0.8))}px system-ui, sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(t.str, t.x, t.y - t.t * 30);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) { ctx.fillStyle = `rgba(255,80,120,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }

    hud();
  }

  function text(str, x, y, size, color, weight = 700, align = 'center', alpha = 1) {
    ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.font = `${weight} ${Math.round(size)}px system-ui, -apple-system, sans-serif`; ctx.fillText(str, x, y); ctx.globalAlpha = 1;
  }

  // HUD font scales with the short side but never drops below a legible 14px on phones.
  function hudFs() { return Math.max(14, Math.min(W - SA.l - SA.r, H - SA.t - SA.b) * 0.045); }

  function drawButtons() {
    const b = buttons();
    const icon = (btn, drawFn) => {
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.strokeStyle = 'rgba(160,190,255,0.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.translate(btn.x, btn.y); ctx.fillStyle = ctx.strokeStyle = '#b8c6e6'; ctx.lineWidth = Math.max(1.5, btn.r * 0.12); ctx.lineCap = 'round';
      drawFn(btn.r * 0.5); ctx.restore();
    };
    icon(b.sound, u => { // speaker + waves / cross
      ctx.beginPath(); ctx.moveTo(-u, -u * 0.35); ctx.lineTo(-u * 0.45, -u * 0.35); ctx.lineTo(u * 0.1, -u * 0.85);
      ctx.lineTo(u * 0.1, u * 0.85); ctx.lineTo(-u * 0.45, u * 0.35); ctx.lineTo(-u, u * 0.35); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      if (muted) { ctx.moveTo(u * 0.45, -u * 0.4); ctx.lineTo(u * 1.05, u * 0.4); ctx.moveTo(u * 1.05, -u * 0.4); ctx.lineTo(u * 0.45, u * 0.4); }
      else { ctx.arc(u * 0.2, 0, u * 0.55, -0.9, 0.9); ctx.moveTo(u * 0.2 + Math.cos(-0.9) * u * 0.95, Math.sin(-0.9) * u * 0.95); ctx.arc(u * 0.2, 0, u * 0.95, -0.9, 0.9); }
      ctx.stroke();
    });
    if (state === 'play' || state === 'paused') icon(b.pause, u => {
      if (state === 'paused') { ctx.beginPath(); ctx.moveTo(-u * 0.5, -u * 0.8); ctx.lineTo(u * 0.85, 0); ctx.lineTo(-u * 0.5, u * 0.8); ctx.closePath(); ctx.fill(); }
      else { ctx.fillRect(-u * 0.6, -u * 0.75, u * 0.42, u * 1.5); ctx.fillRect(u * 0.18, -u * 0.75, u * 0.42, u * 1.5); }
    });
  }

  function hud() {
    const fs = hudFs();
    const blink = 0.55 + Math.sin(performance.now() / 350) * 0.45;
    const tap = isTouch ? 'Tap' : 'Click';
    const top = SA.t + Math.max(10, fs * 0.6);
    if (state === 'menu') {
      ctx.save(); ctx.shadowColor = '#4fe3ff'; ctx.shadowBlur = blur(20);
      text('ORBIT DASH', CX, Math.max(top + fs * 2.6, CY - R - fs * 1.6), fs * 1.9, '#e8fbff', 800); ctx.restore();
      text(isTouch ? 'Tap anywhere to reverse your orbit' : 'Click / Space to reverse your orbit', CX, CY + R + fs * 1.4, fs * 0.72, '#9fb3d9', 500);
      text('Grab ★  ·  Dodge meteors', CX, CY + R + fs * 2.4, fs * 0.62, '#7c8bb0', 500);
      text('Skim past them for a bonus', CX, CY + R + fs * 3.2, fs * 0.62, '#7c8bb0', 500);
      text(tap.toUpperCase() + ' TO START', CX, CY, fs * 0.85, '#4fe3ff', 800, 'center', blink);
      if (best) text('Best: ' + best, CX, CY + R + fs * 4.3, fs * 0.62, '#ffd84a', 600);
      drawButtons();
      return;
    }
    // score block (centred between the two corner buttons)
    text(String(score), CX, top + fs * 0.9, fs * 2, '#ffffff', 800);
    text('BEST ' + best, CX, top + fs * 2.15, fs * 0.55, '#ffd84a', 600, 'center', 0.75);
    if (mult > 1 && state === 'play') {
      text('x' + mult + ' COMBO', CX, top + fs * 3.0, fs * 0.65, '#ffd84a', 800, 'center', 0.6 + 0.4 * Math.min(1, multTimer));
      const w = fs * 4, h = 3; ctx.fillStyle = 'rgba(255,216,74,0.25)'; ctx.fillRect(CX - w / 2, top + fs * 3.5, w, h);
      ctx.fillStyle = '#ffd84a'; ctx.fillRect(CX - w / 2, top + fs * 3.5, w * Math.max(0, multTimer / 3.2), h);
    }
    if (state === 'play' && resumeT > 0) text('Get ready…', CX, CY, fs * 0.8, '#4fe3ff', 700, 'center', 0.5 + 0.5 * Math.sin(resumeT * 20));
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(7,7,15,0.6)'; ctx.fillRect(0, 0, W, H);
      text('PAUSED', CX, CY - fs * 0.4, fs * 1.4, '#e8fbff', 800);
      text(isTouch ? 'tap to resume' : 'click or press P to resume', CX, CY + fs * 0.8, fs * 0.6, '#9fb3d9', 500, 'center', blink);
    }
    if (state === 'over') {
      const a = Math.min(1, deathT * 2.5);
      ctx.fillStyle = `rgba(7,7,15,${0.55 * a})`; ctx.fillRect(0, 0, W, H);
      text('GAME OVER', CX, CY - fs * 1.6, fs * 1.5, '#ff5c8a', 800, 'center', a);
      text('Score ' + score + '   ·   ' + time.toFixed(1) + 's', CX, CY - fs * 0.2, fs * 0.75, '#e8fbff', 600, 'center', a);
      if (newBest) text('★ NEW BEST ★', CX, CY + fs * 0.9, fs * 0.75, '#ffd84a', 800, 'center', a * blink);
      if (deathT > 0.6) text(tap.toLowerCase() + ' to play again', CX, CY + fs * 2.1, fs * 0.6, '#9fb3d9', 500, 'center', blink);
    }
    drawButtons();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const raw = now - last; last = now;
    const dt = Math.min(0.033, raw / 1000);
    // Quality governor: if frames average > 22ms for ~2s of active play, drop glow, then resolution.
    if (state === 'play' && raw < 100) {
      frameAvg = frameAvg * 0.95 + raw * 0.05; fxCheckT += dt;
      if (fxCheckT > 2 && frameAvg > 22) {
        fxCheckT = 0; frameAvg = 16;
        if (hiFx) hiFx = false;
        else if (dprCap > 1) { dprCap = dprCap > 1.5 ? 1.5 : 1; resize(); }
      }
    }
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  resize(); reset(); state = 'menu';
  requestAnimationFrame(frame);

  // Offline + installable app support (silently skipped inside sandboxed previews / file://).
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  } catch (_) {}
})();
</script>
</body>
</html>
