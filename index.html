<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit Dash">
<meta name="description" content="A one-tap neon arcade game: reverse your orbit, grab stars, dodge meteors.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- Link preview card for WhatsApp / iMessage / Telegram / socials (needs absolute URLs) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Orbit Dash">
<meta property="og:title" content="Orbit Dash: can you beat my score? 🚀">
<meta property="og:description" content="One-tap neon arcade game. Reverse your orbit, grab stars, dodge meteors. Free, no download, installs from your browser.">
<meta property="og:url" content="https://sahilarora10.github.io/orbit-dash/">
<meta property="og:image" content="https://sahilarora10.github.io/orbit-dash/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Orbit Dash: a glowing dot orbiting a core, dodging meteors">
<meta name="twitter:card" content="summary_large_image">
<title>Orbit Dash</title>
<style>
  html, body { margin: 0; height: 100%; background: #07070f; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  canvas { position: fixed; left: 0; top: 0; display: block; cursor: pointer; outline: none; touch-action: none; }
  /* Invisible probe so the script can read the device's safe-area insets (notch / home bar). */
  #sa { position: fixed; visibility: hidden; pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

  /* ---------- Progress panel ---------- */
  #panel { position: fixed; inset: 0; z-index: 5; display: none; overflow-y: auto; -webkit-overflow-scrolling: touch;
           touch-action: pan-y; overscroll-behavior: contain; background: #07070f;
           -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: #dfe7ff;
           padding: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-right, 0px) + 14px)
                    calc(env(safe-area-inset-bottom, 0px) + 20px) calc(env(safe-area-inset-left, 0px) + 14px); box-sizing: border-box; }
  #panel.open { display: block; animation: pin .18s ease-out; }
  @keyframes pin { from { transform: translateY(14px); } to { transform: none; } }
  #panel .wrap { max-width: 520px; margin: 0 auto; }
  #panel header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  #panel h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: .5px; color: #e8fbff; text-shadow: 0 0 14px rgba(79,227,255,.5); }
  #panel button { font: inherit; color: inherit; border: 1px solid rgba(160,190,255,.28); background: rgba(255,255,255,.06);
                  border-radius: 12px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
  #panel button:active { transform: scale(.97); }
  #panel .x { width: 44px; padding: 0; font-size: 22px; line-height: 1; }
  #panel .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  #panel .tile { background: rgba(255,255,255,.05); border: 1px solid rgba(160,190,255,.14); border-radius: 14px; padding: 12px 6px; text-align: center; }
  #panel .tile b { display: block; font-size: 26px; color: #fff; line-height: 1.1; }
  #panel .tile span { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #8fa0c8; }
  #panel .tile.gold b { color: #ffd84a; }
  #panel .trend { font-size: 13px; margin: 0 2px 10px; color: #8fa0c8; }
  #panel .trend .up { color: #5dffa8; font-weight: 800; } #panel .trend .down { color: #ff8aa8; font-weight: 800; }
  #panel .chart { background: rgba(255,255,255,.04); border: 1px solid rgba(160,190,255,.14); border-radius: 14px; padding: 8px; margin-bottom: 16px; }
  #panel .chart svg { display: block; width: 100%; height: 120px; }
  #panel .chart small { display: block; text-align: center; color: #6f7fa5; font-size: 11px; margin-top: 2px; }
  #panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; color: #8fa0c8; margin: 0 4px 6px; }
  #panel ol { list-style: none; margin: 0 0 14px; padding: 0; }
  #panel li { display: grid; grid-template-columns: 40px 1fr auto auto; align-items: center; gap: 12px; padding: 9px 12px;
              border-radius: 10px; font-size: 13px; color: #9fb3d9; }
  #panel li:nth-child(odd) { background: rgba(255,255,255,.035); }
  #panel li .n { color: #6f7fa5; font-size: 12px; } #panel li .s { font-size: 18px; font-weight: 800; color: #fff; }
  #panel li .t { color: #8fa0c8; } #panel li .d { color: #6f7fa5; font-size: 12px; text-align: right; min-width: 92px; }
  #panel li .pb { color: #07070f; background: #ffd84a; border-radius: 6px; padding: 1px 6px; font-size: 10px; font-weight: 800; margin-left: 8px; vertical-align: 3px; }
  #panel .empty { text-align: center; padding: 30px 10px; color: #8fa0c8; }
  #panel .actions { display: flex; justify-content: center; }
  #panel .actions .clear { color: #ff8aa8; background: none; border: none; font-size: 13px; opacity: .8; }

  /* Gift card */
  #panel .gift { padding: 14px; margin: 0 0 14px; border-radius: 16px; background: rgba(255,216,74,.07); border: 1px solid rgba(255,216,74,.28); }
  #panel .gift.won { background: rgba(255,216,74,.14); border-color: #ffd84a; box-shadow: 0 0 22px rgba(255,216,74,.18); }
  #panel .gift-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-weight: 700; color: #f3e3a8; font-size: 15px; }
  #panel .gift-top b { color: #ffd84a; font-size: 22px; font-weight: 800; white-space: nowrap; }
  #panel .gift-top b small { font-size: 13px; color: #b9a96a; font-weight: 700; }
  #panel .gift.won .gift-top b { font-size: 34px; }
  #panel .gift-meta { color: #d9c992; font-size: 13px; margin-top: 2px; }
  #panel .gift-hint { color: #b9a96a; font-size: 12px; text-align: center; margin-top: 8px; }
  #panel .bar { height: 8px; margin-top: 10px; border-radius: 99px; background: rgba(255,216,74,.15); overflow: hidden; }
  #panel .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ffb84a, #ffd84a); box-shadow: 0 0 10px rgba(255,216,74,.6); }

  /* WhatsApp buttons (real links so the phone hands off to the WhatsApp app) */
  a.wa, a.claim { display: flex; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box;
                  min-height: 52px; padding: 10px 12px; border-radius: 16px; text-decoration: none; font-weight: 800;
                  font-size: 16px; line-height: 1.15; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  a.wa { background: #25d366; color: #062b14; box-shadow: 0 0 18px rgba(37,211,102,.3); }
  a.wa:active, a.claim:active { transform: scale(.97); }
  a.wa svg, a.claim svg { width: 18px; height: 18px; flex: none; }
  a.wa span, a.claim span { min-width: 0; text-align: center; }
  #panel a.wa { margin-bottom: 14px; }
  a.claim { margin-top: 12px; background: #ffd84a; color: #2a2000; }
  #waStart { position: fixed; z-index: 3; display: none; font-family: inherit; }
  #waStart.show { display: flex; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="sa"></div>
<a id="waStart" class="wa" data-wa="share" href="https://wa.me/" target="_blank" rel="noopener"></a>
<div id="panel" role="dialog" aria-modal="true" aria-label="Your progress"><div class="wrap"></div></div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const saProbe = document.getElementById('sa');
  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 100, S = 1;
  const SA = { t: 0, r: 0, b: 0, l: 0 };
  const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

  // ---------- adaptive quality (phones choke on shadowBlur) ----------
  let hiFx = true, dprCap = 2, frameAvg = 16, fxCheckT = 0;
  const blur = n => (hiFx ? n : 0);
  const fxN = n => (hiFx ? n : Math.ceil(n / 2));

  function resize() {
    const vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    DPR = Math.min(window.devicePixelRatio || 1, dprCap);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const cs = getComputedStyle(saProbe);
    SA.t = parseFloat(cs.paddingTop) || 0; SA.r = parseFloat(cs.paddingRight) || 0;
    SA.b = parseFloat(cs.paddingBottom) || 0; SA.l = parseFloat(cs.paddingLeft) || 0;
    // play area excludes notch / home-indicator zones
    const pw = W - SA.l - SA.r, ph = H - SA.t - SA.b;
    CX = SA.l + pw / 2;
    CY = SA.t + ph / 2 + Math.min(pw, ph) * 0.04;
    // bigger ring in portrait, but keep a visible runway for meteors entering from the sides
    // (off-screen arrows warn about meteors entering from the narrow side margins)
    R = Math.max(60, Math.min(pw * 0.43, ph * 0.36));
    S = R / 150; // scale factor for sizes & speeds
    makeStars();
  }

  // ---------- storage (sandboxed iframes may forbid it; then we keep data in memory) ----------
  const store = {
    get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (_) { return def; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
  };
  const MAX_ROUNDS = 300;
  // Each round: { n: round number, s: score, t: seconds survived, st: stars, c: close calls, mc: max combo, d: timestamp, pb: set a new best }
  let rounds = store.get('orbitDashRounds', []);
  if (!Array.isArray(rounds)) rounds = [];
  let best = Math.max(+store.get('orbitDashBest', 0) || 0, ...rounds.map(r => r.s || 0), 0);
  function saveBest() { store.set('orbitDashBest', best); }
  function recordRound(r) {
    r.n = (rounds.length ? rounds[rounds.length - 1].n : 0) + 1;
    rounds.push(r);
    if (rounds.length > MAX_ROUNDS) rounds = rounds.slice(-MAX_ROUNDS);
    store.set('orbitDashRounds', rounds);
    // Ask the browser not to evict this device's history under storage pressure (Chrome/Android honour this).
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (_) {}
  }
  const avg = a => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);

  // ---------- friend challenge links: ?beat=42 ----------
  const GAME_URL = /^https?:/.test(location.protocol) ? location.origin + location.pathname : 'https://sahilarora10.github.io/orbit-dash/';
  let beat = 0;
  try { beat = Math.max(0, Math.min(9999, parseInt(new URLSearchParams(location.search).get('beat'), 10) || 0)); } catch (_) {}

  // ---------- prize challenge ----------
  // Anyone who scores PRIZE_SCORE or more can ping the organiser to claim a gift.
  // Put a WhatsApp number in PRIZE_WHATSAPP (country code, digits only, e.g. '919876543210')
  // to make Claim prize open that chat directly; left empty, WhatsApp opens and the player picks the chat.
  const PRIZE_SCORE = 150, PRIZE_HOST = 'Sahil', PRIZE_WHATSAPP = '';

  // ---------- WhatsApp sharing ----------
  // Real <a href="https://wa.me/..."> links (not the generic share sheet). On phones we try the
  // whatsapp:// app scheme first, which opens WhatsApp straight to the "send to…" chat picker, and fall
  // back to wa.me if the app didn't open (e.g. WhatsApp not installed).
  const isMobileOS = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const WA_ICON = '<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.7l-.4-.3-3.8 1.2 1.2-3.7-.3-.4c-1.2-1.8-1.9-3.9-1.9-6.1C4.9 9.8 9.9 5 16 5s11.1 4.8 11.1 10.8S22.1 26.4 16 26.4zm6.1-8.1c-.3-.2-2-1-2.3-1.1-.3-.1-.5-.2-.8.2-.2.3-.9 1.1-1.1 1.3-.2.2-.4.3-.7.1-.3-.2-1.4-.5-2.7-1.7-1-.9-1.7-2-1.9-2.3-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.4.3-.6.1-.2 0-.4 0-.6l-1-2.5c-.3-.7-.6-.6-.8-.6h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.7 5.8 5.1 2.9 1.1 3.4.9 4.1.8.6-.1 2-.8 2.3-1.6.3-.8.3-1.5.2-1.6-.1-.2-.3-.3-.6-.4z"/></svg>';
  const waWeb = (text, number = '') => 'https://wa.me/' + number + '?text=' + encodeURIComponent(text);
  const waApp = (text, number = '') => number
    ? 'whatsapp://send?phone=' + number + '&text=' + encodeURIComponent(text)
    : 'whatsapp://send?text=' + encodeURIComponent(text);

  function shareText() {
    return best > 0
      ? `🚀 Can you beat my ${best} in Orbit Dash?\nClick & play 👉 ${GAME_URL}?beat=${best}`
      : `🚀 Let's compete in Orbit Dash!\nClick & play 👉 ${GAME_URL}`;
  }
  const waLabelHtml = () => 'Compete with your friends';
  // The round that set the current best (newest one if tied), for the gift result card.
  const bestRound = () => { for (let i = rounds.length - 1; i >= 0; i--) if (rounds[i].s === best) return rounds[i]; return null; };
  const fmtDate = ts => new Date(ts).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  function claimText() {
    const r = bestRound();
    return `🎁 *Orbit Dash: gift claim*\n\n🏆 Score: *${best}*` +
      (r ? `\n⏱️ ${(r.t || 0).toFixed(1)}s · ⭐ ${r.st || 0} stars · ×${r.mc || 1} combo\n📅 ${fmtDate(r.d)}` : '') +
      `\n\nHey ${PRIZE_HOST}, I scored ${PRIZE_SCORE}+! 😄`;
  }

  // Click handler for every [data-wa] link: try the app, fall back to the web link.
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[data-wa]');
    if (!a) return;
    const claim = a.dataset.wa === 'claim', text = claim ? claimText() : shareText(), num = claim ? PRIZE_WHATSAPP : '';
    a.href = waWeb(text, num); // keep href fresh (long-press → copy link still works)
    if (!isMobileOS) return;   // desktop: let the browser follow wa.me (WhatsApp Web / desktop app)
    e.preventDefault();
    let left = false;
    const onHide = () => { left = true; };
    document.addEventListener('visibilitychange', onHide, { once: true });
    window.addEventListener('pagehide', onHide, { once: true });
    location.href = waApp(text, num);
    setTimeout(() => { if (!left && !document.hidden) window.location.href = waWeb(text, num); }, 1500);
  });

  // ---------- progress panel ----------
  const panel = document.getElementById('panel'), pwrap = panel.querySelector('.wrap');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  function fmtWhen(ts) {
    const d = new Date(ts), now = new Date(), day = 864e5;
    const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const sod = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((sod(now) - sod(d)) / day);
    if (diff === 0) return 'Today ' + hm;
    if (diff === 1) return 'Yesterday ' + hm;
    return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ' + hm;
  }

  function chartSvg(list) {
    const pts = list.slice(-30), n = pts.length, Wc = 300, Hc = 120, pad = 10;
    const max = Math.max(5, ...pts.map(r => r.s)), y = v => Hc - pad - (v / max) * (Hc - pad * 2);
    const x = i => (n === 1 ? Wc / 2 : pad + (i * (Wc - pad * 2)) / (n - 1));
    const line = pts.map((r, i) => `${x(i).toFixed(1)},${y(r.s).toFixed(1)}`).join(' ');
    const dots = pts.map((r, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(r.s).toFixed(1)}" r="${r.pb ? 4 : 2.6}" fill="${r.pb ? '#ffd84a' : '#4fe3ff'}"/>`).join('');
    return `<svg viewBox="0 0 ${Wc} ${Hc}" preserveAspectRatio="none" aria-label="Score chart">
      <line x1="${pad}" x2="${Wc - pad}" y1="${y(best)}" y2="${y(best)}" stroke="#ffd84a" stroke-opacity=".45" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      ${n > 1 ? `<polyline points="${line}" fill="none" stroke="#4fe3ff" stroke-opacity=".8" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>` : ''}
      ${dots}</svg>`;
  }

  function renderPanel() {
    const n = rounds.length;
    const scores = rounds.map(r => r.s);
    const last10 = scores.slice(-10), prev10 = scores.slice(-20, -10);
    // One short trend line, only once there's enough data to mean something.
    let trend = '';
    if (prev10.length >= 3 && last10.length >= 3) {
      const d = avg(last10) - avg(prev10);
      trend = Math.abs(d) < 0.5 ? '● Steady vs your previous 10 rounds'
        : d > 0 ? `<span class="up">▲ +${d.toFixed(1)}</span> vs your previous 10 rounds`
        : `<span class="down">▼ ${d.toFixed(1)}</span> vs your previous 10 rounds`;
    }

    // Gift card: progress bar until 150, then the result + a WhatsApp button to send it.
    const br = bestRound();
    const gift = best >= PRIZE_SCORE
      ? `<div class="gift won">
           <div class="gift-top"><span>🎁 Gift unlocked</span><b>${best}</b></div>
           ${br ? `<div class="gift-meta">${(br.t || 0).toFixed(0)}s · ${br.st || 0} stars · ×${br.mc || 1} combo<br>${esc(fmtDate(br.d))}</div>` : ''}
           <a class="claim" data-wa="claim" href="${esc(waWeb(claimText(), PRIZE_WHATSAPP))}" target="_blank" rel="noopener">${WA_ICON}<span>Share result on WhatsApp</span></a>
           <div class="gift-hint">Send it to ${esc(PRIZE_HOST)} to claim your gift</div>
         </div>`
      : `<div class="gift">
           <div class="gift-top"><span>🎁 Score ${PRIZE_SCORE}+ to win a gift</span><b>${best}<small>/${PRIZE_SCORE}</small></b></div>
           <div class="bar"><i style="width:${Math.min(100, (best / PRIZE_SCORE) * 100).toFixed(1)}%"></i></div>
         </div>`;

    const list = rounds.slice(-50).reverse().map(r => `
      <li><span class="n">#${r.n}</span><span class="s">${r.s}${r.pb ? '<span class="pb">BEST</span>' : ''}</span>
        <span class="t">${(r.t || 0).toFixed(0)}s</span><span class="d">${esc(fmtWhen(r.d))}</span></li>`).join('');

    pwrap.innerHTML = `
      <header><h2>Your Progress</h2><button class="x" data-act="close" aria-label="Close">×</button></header>
      <a class="wa" data-wa="share" href="${esc(waWeb(shareText()))}" target="_blank" rel="noopener">${WA_ICON}<span>${waLabelHtml()}</span></a>
      ${gift}
      ${n ? `
      <div class="tiles">
        <div class="tile gold"><b>${best}</b><span>Best</span></div>
        <div class="tile"><b>${n}</b><span>Rounds</span></div>
        <div class="tile"><b>${avg(last10).toFixed(0)}</b><span>Recent avg</span></div>
      </div>
      ${trend ? `<div class="trend">${trend}</div>` : ''}
      <div class="chart">${chartSvg(rounds)}<small>Last ${Math.min(30, n)} rounds</small></div>
      <h3>History</h3>
      <ol>${list}</ol>
      <div class="actions"><button class="clear" data-act="clear">Clear history</button></div>`
      : `<div class="empty">Play a round and your scores will show up here.</div>`}`;
  }
  function openPanel() { renderPanel(); panel.classList.add('open'); panel.scrollTop = 0; }
  function closePanel() { panel.classList.remove('open'); cv.focus(); }
  const panelOpen = () => panel.classList.contains('open');
  panel.addEventListener('click', e => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (act === 'close') closePanel();
    else if (act === 'clear' && confirm('Delete all ' + rounds.length + ' saved rounds and your best score?')) {
      rounds = []; best = 0; store.set('orbitDashRounds', rounds); saveBest(); renderPanel();
    }
  });

  // ---------- audio ----------
  let actx = null, muted = false;
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function beep(freq, dur = 0.08, type = 'sine', vol = 0.06, slide = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  // Haptics: Android Chrome supports this; iOS Safari silently ignores it.
  function buzz(pattern) { if (muted) return; try { navigator.vibrate && navigator.vibrate(pattern); } catch (_) {} }

  // ---------- background stars ----------
  let bg = [];
  function makeStars() {
    const n = Math.round((W * H) / 3500);
    bg = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.2, tw: Math.random() * 6.28 }));
  }

  // ---------- game state ----------
  let state = 'menu'; // menu | play | over | paused
  let angle, dir, score, mult, multTimer, time, spawnT, meteors, star, parts, texts, shake, flash, deathT, newBest, trail;
  let stars = 0, closes = 0, maxMult = 1, prevAvg = 0, roundNo = 0, prizeHit = false;

  function reset() {
    angle = -Math.PI / 2; dir = 1; score = 0; mult = 1; multTimer = 0; time = 0;
    stars = 0; closes = 0; maxMult = 1; prizeHit = false;
    spawnT = 1.2; meteors = []; parts = []; texts = []; shake = 0; flash = 0; deathT = 0; newBest = false; trail = [];
    placeStar();
  }

  const angSpeed = () => Math.min(2.3 + score * 0.035, 4.4);
  const playerPos = () => ({ x: CX + Math.cos(angle) * R, y: CY + Math.sin(angle) * R });
  const PR = () => 9 * S;

  function placeStar() {
    const off = (Math.PI * 0.6) + Math.random() * Math.PI * 0.8;
    star = { a: angle + off * (Math.random() < 0.5 ? 1 : -1), t: 0 };
  }

  function spawnMeteor() {
    const maxD = Math.hypot(W, H) / 2 + 30;
    // avoid spawning right on top of the player's current spot for fairness
    let th, tries = 0;
    do { th = Math.random() * Math.PI * 2; tries++; } while (tries < 8 && Math.abs(angDiff(th, angle)) < 0.5);
    const lvl = Math.min(score / 40, 1);
    const big = Math.random() < 0.15 + lvl * 0.15;
    const spiral = score >= 8 && Math.random() < 0.25 + lvl * 0.3;
    meteors.push({
      th, d: maxD,
      v: (95 + Math.random() * 45 + lvl * 80) * S * (big ? 0.75 : 1),
      r: (big ? 14 : 7 + Math.random() * 3) * S,
      spin: spiral ? (Math.random() < 0.5 ? -1 : 1) * (0.35 + Math.random() * 0.35) : 0,
      rot: Math.random() * 6.28, near: false, minGap: Infinity, crossed: false,
      hue: big ? 12 : (spiral ? 290 : 350),
    });
  }

  function angDiff(a, b) { let d = (a - b) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }

  function burst(x, y, n, hue, spd = 160, life = 0.7) {
    n = fxN(n);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283, s = (Math.random() * 0.8 + 0.2) * spd * S;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.5 + Math.random() * 0.5), max: life, hue, r: (Math.random() * 2 + 1) * S });
    }
  }
  function popText(x, y, str, hue) { texts.push({ x, y, str, hue, t: 0 }); }

  // ---------- input ----------
  let resumeT = 0; // short freeze after unpausing so a thumb tap doesn't throw you into a meteor

  function pause() { if (state === 'play') state = 'paused'; }
  function resume() { if (state === 'paused') { state = 'play'; resumeT = 0.8; } }
  function togglePause() { state === 'paused' ? resume() : pause(); }
  function toggleMute() { muted = !muted; if (!muted) beep(880, 0.06, 'sine', 0.04); }

  function action() {
    audio();
    if (state === 'menu') { reset(); state = 'play'; resumeT = 0; beep(520, 0.1, 'triangle', 0.05, 300); return; }
    if (state === 'over') { if (deathT > 0.6) { reset(); state = 'play'; resumeT = 0; beep(520, 0.1, 'triangle', 0.05, 300); } return; }
    if (state === 'paused') { resume(); return; }
    if (resumeT > 0) return;
    dir = -dir; beep(dir > 0 ? 660 : 495, 0.05, 'square', 0.025);
    const p = playerPos(); burst(p.x, p.y, 6, 185, 90, 0.35);
  }

  // On-screen buttons (phones have no P / M keys). Hit areas are >= 48px.
  function buttons() {
    const fs = hudFs(), pad = Math.max(10, fs * 0.6), r = Math.max(16, fs * 0.8);
    const y = SA.t + pad + r;
    const right = { x: W - SA.r - pad - r, y, r, hit: Math.max(24, r * 1.4) };
    return {
      sound: { x: SA.l + pad + r, y, r, hit: Math.max(24, r * 1.4) },
      pause: right,  // during play / paused
      stats: right,  // same corner on menu / game-over screens
    };
  }
  const inBtn = (b, x, y) => Math.hypot(x - b.x, y - b.y) <= b.hit;
  const inRect = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;

  // Game-over layout: text rows + primary PLAY AGAIN + secondary PROGRESS (sharing lives on the start screen / Progress).
  // The whole block is measured, then centred on screen, so drawing and tap targets always agree.
  function overPills() {
    const fs = hudFs(), gap = Math.max(10, fs * 0.5);
    const full = Math.min(fs * 18 + gap, W - SA.l - SA.r - 32);
    const h1 = Math.max(52, fs * 2.9), h2 = Math.max(46, fs * 2.4);
    // Title, big score, one status line, and at most ONE extra line (gift > friend challenge > close to gift).
    const rows = [['title', fs * 1.5], ['score', fs * 3.6], ['status', fs * 1.3]];
    if (score >= PRIZE_SCORE) rows.push(['prize', fs * 1.5]);
    else if (beat) rows.push(['beat', fs * 1.4]);
    else if (score >= PRIZE_SCORE * 0.6) rows.push(['near', fs * 1.4]);
    const textH = rows.reduce((a, r) => a + r[1], 0), total = textH + fs * 0.8 + h1 + gap + h2;
    const minY = SA.t + Math.max(56, fs * 3), maxY = H - SA.b - total - 12;
    let y = Math.max(minY, Math.min(CY - total / 2, maxY));
    const rowY = {};
    for (const [k, h] of rows) { rowY[k] = y + h / 2; y += h; }
    const y1 = y + fs * 0.8, y2 = y1 + h1 + gap;
    return {
      rowY,
      again: { x: CX - full / 2, y: y1, w: full, h: h1 },
      progress: { x: CX - full / 2, y: y2, w: full, h: h2 },
    };
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); cv.focus(); audio();
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, b = buttons();
    if (inBtn(b.sound, x, y)) { toggleMute(); return; }
    if ((state === 'play' || state === 'paused') && inBtn(b.pause, x, y)) { togglePause(); return; }
    if ((state === 'menu' || state === 'over') && inBtn(b.stats, x, y)) { openPanel(); return; }
    if (state === 'over' && deathT > 0.6) {
      const p = overPills();
      if (inRect(p.again, x, y)) { action(); return; }
      if (inRect(p.progress, x, y)) { openPanel(); return; }
    }
    action();
  }, { passive: false });
  // Block long-press menus, pinch / double-tap zoom and pull-to-refresh on mobile browsers
  // (but let the Progress panel scroll and its buttons work normally).
  cv.addEventListener('contextmenu', e => e.preventDefault());
  ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick'].forEach(t =>
    document.addEventListener(t, e => {
      if (e.target && e.target.closest && e.target.closest('#panel, #waStart')) { if (t === 'gesturestart' || t === 'dblclick') e.preventDefault(); return; }
      if (e.cancelable) e.preventDefault();
    }, { passive: false }));

  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (panelOpen()) { if (e.code === 'Escape') closePanel(); return; }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); action(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
    else if (e.code === 'KeyM') toggleMute();
  });
  window.addEventListener('blur', pause);
  window.addEventListener('pagehide', pause);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // Rotation / browser-chrome changes: re-layout and pause so the ring doesn't jump under your thumb.
  let resizeQueued = false;
  function onResize() {
    if (resizeQueued) return; resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      const pw = W, ph = H; resize();
      if (state === 'play' && (Math.abs(W - pw) > 40 || Math.abs(H - ph) > 120)) pause();
    });
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

  // ---------- update ----------
  function update(dt) {
    for (const s of bg) s.tw += dt * 2;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = texts.length - 1; i >= 0; i--) { texts[i].t += dt; if (texts[i].t > 0.9) texts.splice(i, 1); }
    shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt * 3);

    if (state === 'over') { deathT += dt; }
    if (state === 'menu') { angle += dt * 1.2; trailPush(); return; }
    if (state !== 'play') return;
    if (resumeT > 0) { resumeT -= dt; return; }

    time += dt;
    angle += dir * angSpeed() * dt;
    trailPush();
    const p = playerPos(), pr = PR();

    // combo decay
    if (mult > 1) { multTimer -= dt; if (multTimer <= 0) { mult = 1; } }

    // star
    star.t += dt;
    const sx = CX + Math.cos(star.a) * R, sy = CY + Math.sin(star.a) * R;
    if (Math.hypot(p.x - sx, p.y - sy) < pr + 11 * S) {
      score += mult; stars++; maxMult = Math.max(maxMult, mult);
      popText(sx, sy - 14 * S, '+' + mult, 50);
      burst(sx, sy, 16, 50, 180, 0.6);
      beep(700 + mult * 120, 0.12, 'triangle', 0.05, 400); buzz(12);
      mult = Math.min(mult + 1, 5); multTimer = 3.2;
      placeStar();
    }

    // prize threshold crossed mid-round
    if (!prizeHit && score >= PRIZE_SCORE) {
      prizeHit = true; flash = 0;
      popText(CX, CY - R * 0.35, '🎁 GIFT UNLOCKED!', 50);
      burst(CX, CY, 40, 50, 260, 1.1);
      beep(880, 0.12, 'triangle', 0.06, 300); setTimeout(() => beep(1320, 0.18, 'triangle', 0.06, 400), 120); buzz([20, 40, 20, 40, 60]);
    }

    // spawn meteors
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnMeteor();
      const lvl = Math.min(score / 45, 1);
      spawnT = (1.05 - lvl * 0.62) * (0.7 + Math.random() * 0.6);
      if (score > 20 && Math.random() < 0.12) spawnMeteor();
    }

    // meteors
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.d -= m.v * dt; m.th += m.spin * dt; m.rot += dt * 2;
      const mx = CX + Math.cos(m.th) * m.d, my = CY + Math.sin(m.th) * m.d;
      const gap = Math.hypot(mx - p.x, my - p.y) - (pr + m.r);
      if (gap < 0) { die(p); return; }
      if (Math.abs(m.d - R) < m.r + pr * 2) m.minGap = Math.min(m.minGap, gap);
      if (!m.crossed && m.d < R - m.r - pr * 2) {
        m.crossed = true;
        if (m.minGap < 10 * S) { score += 1; closes++; popText(p.x, p.y - 18 * S, 'CLOSE! +1', 185); beep(980, 0.07, 'sine', 0.04, 200); buzz([6, 30, 6]); burst(p.x, p.y, 8, 185, 120, 0.4); }
      }
      if (m.d < 12 * S) { burst(CX, CY, 6, m.hue, 70, 0.4); meteors.splice(i, 1); }
    }
  }

  function trailPush() { const p = playerPos(); trail.push({ x: p.x, y: p.y }); if (trail.length > 14) trail.shift(); }

  function die(p) {
    state = 'over'; deathT = 0; shake = 14; flash = 1;
    burst(p.x, p.y, 50, 185, 260, 1.1); burst(p.x, p.y, 25, 350, 200, 0.9);
    beep(220, 0.5, 'sawtooth', 0.07, -170); buzz([40, 50, 90]);
    prevAvg = avg(rounds.slice(-10).map(r => r.s)); // average *before* this round, for comparison
    if (score > best) { best = score; newBest = true; saveBest(); }
    recordRound({ s: score, t: Math.round(time * 10) / 10, st: stars, c: closes, mc: maxMult, d: Date.now(), pb: newBest });
    roundNo = rounds[rounds.length - 1].n;
  }

  // ---------- draw ----------
  function glowCircle(x, y, r, color, b) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur(b); ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
  }

  function draw() {
    ctx.save();
    ctx.fillStyle = '#07070f'; ctx.fillRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // background
    for (const s of bg) { ctx.globalAlpha = 0.35 + Math.sin(s.tw) * 0.25; ctx.fillStyle = '#cfd8ff'; ctx.fillRect(s.x, s.y, s.r, s.r); }
    ctx.globalAlpha = 1;

    // core
    const pulse = 1 + Math.sin(performance.now() / 300) * 0.08;
    const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, 40 * S * pulse);
    g.addColorStop(0, 'rgba(140,90,255,0.9)'); g.addColorStop(0.4, 'rgba(90,40,200,0.35)'); g.addColorStop(1, 'rgba(60,20,160,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(CX, CY, 40 * S * pulse, 0, 6.283); ctx.fill();
    glowCircle(CX, CY, 6 * S, '#e6dcff', 20);

    // ring
    ctx.save(); ctx.strokeStyle = 'rgba(80,220,255,0.22)'; ctx.lineWidth = 2; ctx.setLineDash([4 * S, 8 * S]);
    ctx.lineDashOffset = -performance.now() / 40 * (dir || 1);
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.283); ctx.stroke(); ctx.restore();

    // star pickup
    if (state === 'play' || state === 'over' || state === 'paused') {
      const sx = CX + Math.cos(star.a) * R, sy = CY + Math.sin(star.a) * R;
      const sp = 1 + Math.sin(star.t * 6) * 0.15;
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(star.t * 1.5); ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = blur(18); ctx.fillStyle = '#ffd84a';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) { const rr = (i % 2 ? 4.5 : 10) * S * sp, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // meteors
    if (meteors) for (const m of meteors) {
      const mx = CX + Math.cos(m.th) * m.d, my = CY + Math.sin(m.th) * m.d;
      // tail
      const tx = CX + Math.cos(m.th - m.spin * 0.12) * (m.d + m.r * 3.2), ty = CY + Math.sin(m.th - m.spin * 0.12) * (m.d + m.r * 3.2);
      const tg = ctx.createLinearGradient(mx, my, tx, ty);
      tg.addColorStop(0, `hsla(${m.hue},100%,60%,0.55)`); tg.addColorStop(1, `hsla(${m.hue},100%,60%,0)`);
      ctx.strokeStyle = tg; ctx.lineWidth = m.r * 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.save(); ctx.translate(mx, my); ctx.rotate(m.rot); ctx.shadowColor = `hsl(${m.hue},100%,60%)`; ctx.shadowBlur = blur(16);
      ctx.fillStyle = `hsl(${m.hue},95%,62%)`; ctx.beginPath();
      for (let i = 0; i < 7; i++) { const a = i / 7 * 6.283, rr = m.r * (i % 2 ? 0.78 : 1); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }

    // off-screen warnings: on narrow phone screens meteors can enter from just past the edge
    if (meteors && state === 'play') for (const m of meteors) {
      const c = Math.cos(m.th), s = Math.sin(m.th);
      const tx = c > 1e-6 ? (W - CX) / c : c < -1e-6 ? CX / -c : Infinity;
      const ty = s > 1e-6 ? (H - CY) / s : s < -1e-6 ? CY / -s : Infinity;
      const e = Math.min(tx, ty);
      if (m.d - m.r <= e) continue;
      const k = Math.max(0.15, Math.min(0.9, 1 - (m.d - e) / (220 * S)));
      const ed = e - 10, ix = CX + c * ed, iy = CY + s * ed, sz = Math.max(5, 6 * S) * (m.r > 12 * S ? 1.4 : 1);
      ctx.save(); ctx.globalAlpha = k; ctx.translate(ix, iy); ctx.rotate(m.th + Math.PI);
      ctx.fillStyle = `hsl(${m.hue},100%,62%)`; ctx.beginPath();
      ctx.moveTo(sz, 0); ctx.lineTo(-sz * 0.7, sz * 0.8); ctx.lineTo(-sz * 0.7, -sz * 0.8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // player + trail
    if (state !== 'over') {
      for (let i = 0; i < trail.length; i++) {
        const t = trail[i], k = i / trail.length;
        ctx.globalAlpha = k * 0.5; ctx.fillStyle = '#4fe3ff';
        ctx.beginPath(); ctx.arc(t.x, t.y, PR() * k, 0, 6.283); ctx.fill();
      }
      ctx.globalAlpha = 1;
      const p = playerPos();
      glowCircle(p.x, p.y, PR(), '#4fe3ff', 22);
      glowCircle(p.x, p.y, PR() * 0.45, '#ffffff', 6);
    }

    // particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = `hsl(${p.hue},100%,65%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // floating texts
    for (const t of texts) {
      ctx.globalAlpha = 1 - t.t / 0.9; ctx.fillStyle = `hsl(${t.hue},100%,70%)`;
      ctx.font = `700 ${Math.round(14 * Math.max(S, 0.8))}px system-ui, sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(t.str, t.x, t.y - t.t * 30);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (flash > 0) { ctx.fillStyle = `rgba(255,80,120,${flash * 0.35})`; ctx.fillRect(0, 0, W, H); }

    hud();
  }

  function text(str, x, y, size, color, weight = 700, align = 'center', alpha = 1) {
    ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.font = `${weight} ${Math.round(size)}px system-ui, -apple-system, sans-serif`; ctx.fillText(str, x, y); ctx.globalAlpha = 1;
  }

  // Shrink a font size until the string fits maxW (keeps long lines on-screen on narrow phones).
  function fitSize(str, size, maxW, weight = 700) {
    ctx.font = `${weight} ${Math.round(size)}px system-ui, -apple-system, sans-serif`;
    const w = ctx.measureText(str).width;
    return w > maxW && w > 0 ? Math.max(10, size * maxW / w) : size;
  }

  // HUD font scales with the short side but never drops below a legible 14px on phones.
  function hudFs() { return Math.max(15, Math.min(30, Math.min(W - SA.l - SA.r, H - SA.t - SA.b) * 0.05)); }

  function drawButtons() {
    const b = buttons();
    const icon = (btn, drawFn) => {
      ctx.save(); ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.strokeStyle = 'rgba(160,190,255,0.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.translate(btn.x, btn.y); ctx.fillStyle = ctx.strokeStyle = '#b8c6e6'; ctx.lineWidth = Math.max(1.5, btn.r * 0.12); ctx.lineCap = 'round';
      drawFn(btn.r * 0.5); ctx.restore();
    };
    icon(b.sound, u => { // speaker + waves / cross
      ctx.beginPath(); ctx.moveTo(-u, -u * 0.35); ctx.lineTo(-u * 0.45, -u * 0.35); ctx.lineTo(u * 0.1, -u * 0.85);
      ctx.lineTo(u * 0.1, u * 0.85); ctx.lineTo(-u * 0.45, u * 0.35); ctx.lineTo(-u, u * 0.35); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      if (muted) { ctx.moveTo(u * 0.45, -u * 0.4); ctx.lineTo(u * 1.05, u * 0.4); ctx.moveTo(u * 1.05, -u * 0.4); ctx.lineTo(u * 0.45, u * 0.4); }
      else { ctx.arc(u * 0.2, 0, u * 0.55, -0.9, 0.9); ctx.moveTo(u * 0.2 + Math.cos(-0.9) * u * 0.95, Math.sin(-0.9) * u * 0.95); ctx.arc(u * 0.2, 0, u * 0.95, -0.9, 0.9); }
      ctx.stroke();
    });
    if (state === 'play' || state === 'paused') icon(b.pause, u => {
      if (state === 'paused') { ctx.beginPath(); ctx.moveTo(-u * 0.5, -u * 0.8); ctx.lineTo(u * 0.85, 0); ctx.lineTo(-u * 0.5, u * 0.8); ctx.closePath(); ctx.fill(); }
      else { ctx.fillRect(-u * 0.6, -u * 0.75, u * 0.42, u * 1.5); ctx.fillRect(u * 0.18, -u * 0.75, u * 0.42, u * 1.5); }
    });
    else icon(b.stats, u => { // bar-chart icon → Progress panel
      ctx.fillRect(-u * 0.85, u * 0.1, u * 0.45, u * 0.75);
      ctx.fillRect(-u * 0.22, -u * 0.35, u * 0.45, u * 1.2);
      ctx.fillRect(u * 0.4, -u * 0.85, u * 0.45, u * 1.7);
    });
  }

  function pill(b, label, bgc, fg, alpha, opts = {}) {
    ctx.save(); ctx.globalAlpha = alpha;
    const r = Math.min(b.h / 2, 24);
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(b.x, b.y, b.w, b.h, r); else ctx.rect(b.x, b.y, b.w, b.h);
    if (opts.glow) { ctx.shadowColor = bgc; ctx.shadowBlur = blur(opts.glow); }
    ctx.fillStyle = bgc; ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = opts.border || 'rgba(160,190,255,0.3)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
    const size = Math.min(hudFs() * (opts.size || 0.68), b.w / (label.length * 0.62 + (opts.play ? 2 : 0)));
    let tx = b.x + b.w / 2;
    if (opts.play) { // drawn play triangle (emoji ▶ renders inconsistently across phones)
      ctx.font = `800 ${Math.round(size)}px system-ui, -apple-system, sans-serif`;
      const tw = ctx.measureText(label).width, ic = size * 0.8, sp = size * 0.5, x0 = tx - (tw + ic + sp) / 2, cy = b.y + b.h / 2;
      ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = fg; ctx.beginPath();
      ctx.moveTo(x0, cy - ic / 2); ctx.lineTo(x0 + ic * 0.85, cy); ctx.lineTo(x0, cy + ic / 2); ctx.closePath(); ctx.fill(); ctx.restore();
      tx = x0 + ic + sp + tw / 2;
    }
    text(label, tx, b.y + b.h / 2 + 1, size, fg, 800, 'center', alpha);
  }

  // The start-screen WhatsApp button is a real HTML link layered over the canvas (links hand off to the
  // WhatsApp app far more reliably than script-opened windows). Only touch the DOM when something changes.
  const waStart = document.getElementById('waStart');
  let waRect = '', waLabel = '', waShown = false;
  function placeWaStart(x, y, w, h) {
    const r = `${Math.round(x)},${Math.round(y)},${Math.round(w)},${Math.round(h)}`;
    if (r !== waRect) {
      waRect = r;
      Object.assign(waStart.style, { left: Math.round(x) + 'px', top: Math.round(y) + 'px', width: Math.round(w) + 'px', minHeight: Math.round(h) + 'px' });
    }
    const label = waLabelHtml();
    if (label !== waLabel) { waLabel = label; waStart.innerHTML = WA_ICON + '<span>' + label + '</span>'; waStart.href = waWeb(shareText()); }
  }
  function showWaStart(on) { if (on !== waShown) { waShown = on; waStart.classList.toggle('show', on); } }

  function hud() {
    const fs = hudFs();
    showWaStart(state === 'menu' && !panelOpen());
    const blink = 0.55 + Math.sin(performance.now() / 350) * 0.45;
    const tap = isTouch ? 'Tap' : 'Click';
    const top = SA.t + Math.max(10, fs * 0.6);
    if (state === 'menu') {
      text(tap.toUpperCase() + ' TO START', CX, CY - Math.max(fs * 1.7, 30 * S), fs * 0.95, '#4fe3ff', 800, 'center', blink);
      if (beat) text('🎯 Beat your friend: ' + beat, CX, CY + Math.max(fs * 1.7, 30 * S), fitSize('🎯 Beat your friend: ' + beat, fs * 0.72, R * 1.6, 800), '#ffd84a', 800);
      // Three short lines: the one control, the goal, the gift (+ best score once there is one).
      const info = [
        [isTouch ? 'Tap to switch direction' : 'Click or Space to switch direction', 0.84, '#dfe7ff', 700],
        ['Collect ★   ·   Avoid meteors', 0.72, '#8fa0c8', 600],
        [best >= PRIZE_SCORE ? '🎁 Gift unlocked! Claim it in Progress' : `🎁 Score ${PRIZE_SCORE}+ to win a gift`, 0.78, '#ffd84a', 800],
      ];
      if (best) info.push(['Your best: ' + best, 0.66, '#b9a96a', 600]);
      const lineH = fs * 1.35, pw = W - SA.l - SA.r, sideW = CX - R - SA.l - fs;
      const bh = Math.max(52, fs * 2.7), bgap = fs * 1.0; // WhatsApp button height + gap above it
      const title = (x, y, maxW) => {
        ctx.save(); ctx.shadowColor = '#4fe3ff'; ctx.shadowBlur = blur(24);
        text('ORBIT DASH', x, y, fitSize('ORBIT DASH', fs * 2.2, maxW, 800), '#e8fbff', 800); ctx.restore();
      };
      const blockH = (info.length - 1) * lineH;
      if (sideW >= fs * 11) {
        // landscape: title on the left; instructions + WhatsApp button on the right; ring in the middle
        const lx = SA.l + (CX - R - SA.l) / 2, rx = CX + R + (W - SA.r - CX - R) / 2;
        title(lx, CY, sideW);
        const colH = blockH + lineH / 2 + bgap + bh, y0 = CY - colH / 2 + lineH / 4;
        info.forEach(([s, k, c, wt], i) => text(s, rx, y0 + i * lineH, fitSize(s, fs * k, sideW, wt), c, wt));
        const bw = Math.min(sideW + fs * 0.4, 340);
        placeWaStart(rx - bw / 2, y0 + blockH + lineH / 2 + bgap, bw, bh);
      } else {
        // portrait: title above the ring; instructions + WhatsApp button below (slid up over the ring edge if short on room)
        title(CX, Math.max(top + fs * 2.4, CY - R - fs * 1.7), pw - 24);
        let y = CY + R + fs * 1.5;
        const need = blockH + lineH / 2 + bgap + bh;
        if (y + need > H - SA.b - 14) y = H - SA.b - 14 - need;
        info.forEach(([s, k, c, wt], i) => text(s, CX, y + i * lineH, fitSize(s, fs * k, pw - 24, wt), c, wt));
        const bw = Math.min(360, pw - 32);
        placeWaStart(CX - bw / 2, y + blockH + lineH / 2 + bgap, bw, bh);
      }
      drawButtons();
      return;
    }
    // score block (centred between the two corner buttons); the game-over card shows its own score
    if (state !== 'over') {
      text(String(score), CX, top + fs * 0.9, fs * 2, score >= PRIZE_SCORE ? '#ffd84a' : '#ffffff', 800);
      text('BEST ' + best, CX, top + fs * 2.15, fs * 0.55, '#ffd84a', 600, 'center', 0.75);
    }
    if (mult > 1 && state === 'play') {
      text('x' + mult + ' COMBO', CX, top + fs * 3.0, fs * 0.65, '#ffd84a', 800, 'center', 0.6 + 0.4 * Math.min(1, multTimer));
      const w = fs * 4, h = 3; ctx.fillStyle = 'rgba(255,216,74,0.25)'; ctx.fillRect(CX - w / 2, top + fs * 3.5, w, h);
      ctx.fillStyle = '#ffd84a'; ctx.fillRect(CX - w / 2, top + fs * 3.5, w * Math.max(0, multTimer / 3.2), h);
    }
    if (state === 'play' && resumeT > 0) text('Get ready…', CX, CY, fs * 0.8, '#4fe3ff', 700, 'center', 0.5 + 0.5 * Math.sin(resumeT * 20));
    if (state === 'paused') {
      ctx.fillStyle = 'rgba(7,7,15,0.6)'; ctx.fillRect(0, 0, W, H);
      text('PAUSED', CX, CY - fs * 0.4, fs * 1.4, '#e8fbff', 800);
      text(isTouch ? 'tap to resume' : 'click or press P to resume', CX, CY + fs * 0.8, fs * 0.6, '#9fb3d9', 500, 'center', blink);
    }
    if (state === 'over') {
      const a = Math.min(1, deathT * 2.5);
      ctx.fillStyle = `rgba(7,7,15,${0.72 * a})`; ctx.fillRect(0, 0, W, H);
      const p = overPills(), Y = p.rowY, maxW = W - SA.l - SA.r - 24;
      const line = (s, y, k, c, wt, al = a) => text(s, CX, y, fitSize(s, fs * k, maxW, wt), c, wt, 'center', al);
      line('GAME OVER', Y.title, 0.95, '#ff5c8a', 800);
      ctx.save(); ctx.shadowColor = score >= PRIZE_SCORE ? '#ffd84a' : '#4fe3ff'; ctx.shadowBlur = blur(22);
      line(String(score), Y.score, 3.4, score >= PRIZE_SCORE ? '#ffd84a' : '#ffffff', 800); ctx.restore();
      if (newBest) line('★ New best!', Y.status, 0.8, '#ffd84a', 800, a * (0.7 + 0.3 * blink));
      else line('Best ' + best, Y.status, 0.72, '#b9a96a', 600);
      if (Y.prize) line('🎁 Gift unlocked! Claim it in Progress', Y.prize, 0.72, '#ffd84a', 800, a * (0.75 + 0.25 * blink));
      else if (Y.beat) line(score > beat ? `🎉 You beat your friend's ${beat}!` : `🎯 ${beat - score + 1} more to beat your friend`, Y.beat, 0.68, '#ffd84a', 700);
      else if (Y.near) line(`🎁 ${PRIZE_SCORE - score} more for the gift`, Y.near, 0.68, '#ffd84a', 700);
      if (deathT > 0.6) {
        const pa = Math.min(1, (deathT - 0.6) * 4);
        const breathe = 10 + 8 * (0.5 + 0.5 * Math.sin(performance.now() / 420));
        pill(p.again, 'PLAY AGAIN', '#4fe3ff', '#04202a', pa, { play: true, size: 0.95, glow: breathe, border: 'rgba(200,250,255,0.7)' });
        if (score >= PRIZE_SCORE) pill(p.progress, 'PROGRESS', 'rgba(255,216,74,0.18)', '#ffd84a', pa, { size: 0.72, glow: 10, border: '#ffd84a' });
        else pill(p.progress, 'PROGRESS', 'rgba(255,255,255,0.07)', '#dfe7ff', pa, { size: 0.72 });
        if (!isTouch) text('or press Space to play again', CX, p.progress.y + p.progress.h + fs * 0.9, fs * 0.55, '#6f7fa5', 500, 'center', pa * 0.9);
      }
    }
    drawButtons();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const raw = now - last; last = now;
    const dt = Math.min(0.033, raw / 1000);
    // Quality governor: if frames average > 22ms for ~2s of active play, drop glow, then resolution.
    if (state === 'play' && raw < 100) {
      frameAvg = frameAvg * 0.95 + raw * 0.05; fxCheckT += dt;
      if (fxCheckT > 2 && frameAvg > 22) {
        fxCheckT = 0; frameAvg = 16;
        if (hiFx) hiFx = false;
        else if (dprCap > 1) { dprCap = dprCap > 1.5 ? 1.5 : 1; resize(); }
      }
    }
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  resize(); reset(); state = 'menu';
  requestAnimationFrame(frame);

  // Offline + installable app support (silently skipped inside sandboxed previews / file://).
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  } catch (_) {}
})();
</script>
</body>
</html>
